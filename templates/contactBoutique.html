{% extends "base.html" %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Boutique Wishlist & Cart</title>
  <!-- <script src="script.js"></script> -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Roboto&display=swap" rel="stylesheet">
  
  <!-- Link to external CSS file -->
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesBoutique.css') }}">
</head>
<body>


<!--HTML-->
  <header>Boutique Wishlist & Cart</header>

  <div class="container">

    <!-- Wishlist -->
    <div class="section" id="wishlist">
      <h2>💖 Wishlist</h2>
       <div class="item">
        <img src="IMAGES/32 Kitenge Dress Designs 2023 & Ankara Styles.jpg" alt="Dress"> 
        
        <div class="item-info">
          <h4>Floral Summer Dress</h4>
          <p>$49.99</p>
        </div>

        <div class="item-actions">
          <!-- <button class="move" onclick="moveToCart(this)">Move to Cart</button> -->
          <button class="remove" onclick="removeItem(this)">Remove</button>
        </div>
        
      </div>
    </div>

    <!-- Cart -->
      <div class="section" id="cart">
      <h2>🛒 Your Cart</h2>
      <!-- Cart items will be added here -->
    </div>
  </div>



</body>
</html>
{% endblock %}
