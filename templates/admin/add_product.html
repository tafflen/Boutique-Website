<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product | Boutique Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }

    .sidebar {
      width: 240px;
      min-height: 100vh;
      background: #1a1a2e;
      color: white;
      padding: 30px 20px;
      position: fixed;
    }

    .sidebar h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 30px;
      color: #e0aaff;
    }

    .sidebar a {
      display: block;
      color: #ccc;
      text-decoration: none;
      padding: 10px 0;
      font-size: 14px;
      border-bottom: 1px solid #333;
    }

    .sidebar a:hover { color: white; }
    .sidebar a.active { color: white; font-weight: 600; }

    .main-content {
      margin-left: 240px;
      padding: 40px;
    }

    .form-card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      max-width: 680px;
    }

    .form-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #1a1a2e;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
      transition: border .2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #6c4fcf;
    }

    textarea { resize: vertical; min-height: 100px; }

    .btn-submit {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-submit:hover { background: #2d2d4e; }

    .btn-cancel {
      background: #f0f0f0;
      color: #555;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      text-decoration: none;
      margin-left: 12px;
    }

    .btn-cancel:hover { background: #e0e0e0; color: #333; }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .alert-error   { background: #fff0f0; color: #e53935; }
    .alert-success { background: #f0fff4; color: #2e7d32; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Boutique Admin</h2>
    <a href="/admin">Dashboard</a>
    <a href="/admin/products" class="active">Products</a>
    <a href="/admin/orders">Orders</a>
    <a href="/">View Store</a>
    <a href="/logout">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="form-card">
      <h2>Add New Product</h2>

      <!--Add enctype — without this, file won't upload -->
      <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Product Name *</label>
        <input type="text" name="name" placeholder="e.g. Silk Saree"
               value="{{ request.form.get('name', '') }}" required>

        <label>Description</label>
        <textarea name="description"
                  placeholder="Describe the product...">{{ request.form.get('description', '') }}</textarea>

        <label>Category *</label>
        <select name="category">
          <option value="">-- Select Category --</option>
          <option value="Sarees"       {% if request.form.get('category') == 'Sarees' %}selected{% endif %}>Sarees</option>
          <option value="Tops"         {% if request.form.get('category') == 'Tops' %}selected{% endif %}>Tops</option>
          <option value="Kurtis"       {% if request.form.get('category') == 'Kurtis' %}selected{% endif %}>Kurtis</option>
          <option value="Accessories"  {% if request.form.get('category') == 'Accessories' %}selected{% endif %}>Accessories</option>
          <option value="Lehengas"     {% if request.form.get('category') == 'Lehengas' %}selected{% endif %}>Lehengas</option>
          <option value="Other"        {% if request.form.get('category') == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <label>Price (₹) *</label>
        <input type="number" name="price" placeholder="e.g. 1299"
               step="0.01" min="0"
               value="{{ request.form.get('price', '') }}" required>

        <label>Stock Quantity *</label>
        <input type="number" name="stock" placeholder="e.g. 10"
               min="0"
               value="{{ request.form.get('stock', '') }}" required>

         <label>Product Image</label>
        <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp">
        <small style="color:#aaa; font-size:12px; display:block; margin-top:-14px; margin-bottom:20px;">
          Accepted: JPG, PNG, WEBP — Max 5MB
        </small>

        <div>
          <button type="submit" class="btn-submit">Add Product</button>
          <a href="/admin/products" class="btn-cancel">Cancel</a>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
